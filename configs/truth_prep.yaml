# truth_labware.yaml plus liquid-prep limits (execution/truth.py, execution/supplies.py): stocks above
# their DMSO solubility, too much DMSO in the well. Drug dilutions age from the batch they came from.
read_equilibration_min: 30
read_equilibration_noise: 0.15
drug_rt_stable_min: 1440
drug_halflife_min: 720
changeover_wells: 24
actual_timepoint: true
qc_z_min: 0.5
plates:
  clear: {crosstalk: 0.05}       # each well picks up 5% of its neighbours' mean signal
  black: {extra_noise: 0.04}     # less light reaches the reader
under_range_cv: 0.25             # tip below its validated volume: dose spread
under_range_bias: -0.25          # and 25% less liquid than asked
carryover_wells: 24               # a reused contact tip in wet wells mixes neighbours' contents
stock_solubility: true           # Cayman sheets: solubility in DMSO per drug
dmso_max_pct: 2.0                # TB288 p.9: DMSO tested up to 2% final
dmso_kill_per_pct: 0.25
sources:
  read_equilibration_min: "promega_tb288 p.7: Equilibrate the plate and its contents at room temperature for approximately 30 minutes."
  drug_rt_stable_min: "cayman_* p.1: We do not recommend storing the aqueous solution for more than one day."
  changeover_wells: "atcc_culture_guide p.26: Cross-contamination of 1 cell line with another can sometimes lead to the replacement of the original cell with the contaminant"
  plates: "promega_tb288 p.10: Opaque-walled plates with clear bottoms ... will have diminished signal intensity and greater cross talk between wells; lab_catalog p.1: PL-384-WHT ... for luminescence assays."
  under_range: "lab_catalog p.2: Volumes below a tip's validated range are not covered by that check: expect less liquid than asked and more spread between channels."
  stock_solubility: "cayman_* p.1: The solubility of sorafenib in these solvents is approximately 20 mg/ml."
  dmso_max_pct: "promega_tb288 p.9: Dimethylsulfoxide (DMSO) ... has been tested at final concentrations of up to 2%"
  carryover_wells: "lab_catalog p.2: A reused tip that touches liquid in a well carries that well's contents to the next wells it serves"
