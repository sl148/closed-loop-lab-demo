# Level 3 execution uncertainty: Level 2 plus op durations +-20%, tip-pickup / liquid-transfer
# / misplacement / measurement failures with retest wells, recovered by the failure adapter.
name: level3
rounds: 5
plates_per_round: 3
designer: bo-ts
layout: optimized
scheduler: fifo
mode: sync
policy: rules

space:
  cell_lines: [ZR751, NCIH2122, MDAMB436]
  doses:
    - {max: 10.0, steps: 7, fold: 3}
    - {max: 20.0, steps: 7, fold: 3}
    - {max: 0.04, steps: 7, fold: 3}
  timepoints_h: [24, 48, 72]

oracle:
  source: oneil
  drugs: [MK-4827, SORAFENIB, VINBLASTINE]
  cell_lines: [ZR751, NCIH2122, MDAMB436]

noise: {rel_sigma: 0.07, edge_bias: 0.08, pipette_cv: 0.03}
plate: {rows: 16, cols: 24}
resources: {liquid_handlers: 1, readers: 1, arms: 1, incubators: 1, incubator_slots: 8}
durations: {}
failures:
  duration_cv: 0.2
  p_tip_pickup: 0.1
  p_liquid_transfer: 0.05
  p_misplace: 0.03
  p_measurement: 0.1
