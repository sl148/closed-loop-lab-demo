[project]
name = "labloop"
version = "0.1.0"
description = "Closed-loop lab automation demo: drug-combination screening with experiment selection, plate layout, and equipment scheduling"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "simpy>=4.1",
    "ortools>=9.10",
    "pyyaml>=6.0",
    "pylabrobot==0.2.2",
    "botorch>=0.18.1",
    "matplotlib>=3.11.2",
    "mujoco>=3.16.0",
    "anthropic>=2.1.0",
    "pydantic>=2.14.1",
    "synergy>=1.0.0",
    "pypdf>=5.0",
    "openpyxl>=3.1",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/labloop"]

[tool.uv]
# OneDrive breaks uv hardlinks (os error 396).
link-mode = "copy"

[tool.pytest.ini_options]
testpaths = ["tests"]
